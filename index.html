<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Suzanne & Matt – Wedding</title>

  <meta name="description" content="Wedding website for Suzanne & Matt" />

  <!-- Simple, readable font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="hero">
    <div class="hero-content">
       <h1 class="nowrap">Suzanne & Matt</h1>
      <p class="subtitle">We’re getting married!!!</p>
    </div>
  </header>

  <main>
    <nav>
        <a href="#details">Details</a>
        <a href="#rsvp">RSVP</a>
        <a href="#schedule">Schedule</a>
        <a href="#travel">Travel and Accommodations</a>
        <a href="#gifts">Gifts</a>
        <a href="#memories">Special moments</a>
      </nav>

    <section id="details" data-md="content/details.md"></section>
    <section id="rsvp" data-md="content/rsvp.md"></section>
    <section id="schedule" data-md="content/schedule.md"></section>
    <section id="travel" data-md="content/travel.md"></section>
    <section id="gifts" data-md="content/gifts.md"></section>

      <section id="memories" class="carousel-section">
    <h2>Some special moments</h2>

    <div class="carousel">
      <button class="carousel-btn prev" aria-label="Previous">‹</button>

      <div class="carousel-track">
        <!-- Slides will be injected here by JS -->
      </div>

      <button class="carousel-btn next" aria-label="Next">›</button>
    </div>
  </section>


  
  </main>

  <footer>
    <p>We can’t wait to celebrate with you ❤️</p>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  document.querySelectorAll("[data-md]").forEach(async (section) => {
    const path = section.getAttribute("data-md");
    const response = await fetch(path);
    const markdown = await response.text();
    section.innerHTML = marked.parse(markdown);
  });
</script>

<script src="carousel.js"></script>

</body>
</html>
